# ---------------------------------------------------------------------------
# vLLM: OpenAI-compatible inference server on the Spot GPU pool. Image comes
# from Artifact Registry; weights from the GCS-FUSE mount. No egress (enforced
# by the llm/default-deny NetworkPolicy). Serves on :8000.
#
# only-dir=current means the mount root IS weights/current, so --model=/models.
# Replace <ARTIFACT_REGISTRY> at deploy time (scripts/deploy.sh).
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm
  labels: { app: vllm }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vllm }
  template:
    metadata:
      labels: { app: vllm }
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: vllm
      nodeSelector:
        workload: llm
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        # GPU pool runs on Spot; tolerate the gke-spot taint (any effect).
        - key: cloud.google.com/gke-spot
          operator: Exists
      containers:
        - name: vllm
          image: REGION-docker.pkg.dev/PROJECT/privllm-images/vllm/vllm-openai:v0.6.3
          args:
            - --model=/models
            - --served-model-name=private-llm
            - --host=0.0.0.0
            - --port=8000
            - --tensor-parallel-size=1
            - --max-model-len=16384
            - --gpu-memory-utilization=0.92
            - --disable-log-requests=false   # request metadata -> stdout -> Cloud Logging
            # Tool calling + streaming — required by Copilot CLI and agentic
            # clients. Parser must match the model family (llama3_json = Llama 3.x).
            - --enable-auto-tool-choice
            - --tool-call-parser=llama3_json
          ports:
            - { containerPort: 8000, name: http }
          env:
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 160Gi
            requests:
              cpu: "8"
              memory: 120Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 300
            periodSeconds: 20
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: models-pvc }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm
  labels: { app: vllm }
spec:
  selector: { app: vllm }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
  type: ClusterIP
